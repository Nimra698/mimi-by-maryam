<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Shopping Bag | MIMI BY MARYAM</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        .cart-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px 80px 20px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }
        .cart-items-section {
            flex: 1.6;
            width: 100%;
        }
        .cart-header-title {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eae6e1;
            padding-bottom: 15px;
        }
        .cart-item-row {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eae6e1;
            align-items: center;
        }
        .cart-item-img {
            width: 95px;
            height: 120px;
            object-fit: cover;
            background-color: #fafafa;
            flex-shrink: 0;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-title {
            font-size: 15px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 6px;
        }
        .cart-item-meta {
            font-size: 13px;
            color: #666666;
            margin-bottom: 12px;
        }
        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-qty-box {
            display: flex;
            border: 1px solid #eae6e1;
            align-items: center;
        }
        .cart-qty-btn {
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .cart-qty-num {
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
        }
        .remove-item-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .remove-item-btn:hover {
            color: #111111;
        }
        .cart-item-subtotal {
            font-size: 15px;
            font-weight: bold;
            color: #111111;
        }
        .order-summary-panel {
            flex: 1;
            background-color: #faf8f5;
            padding: 30px;
            border: 1px solid #eae6e1;
        }
        .summary-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eae6e1;
            padding-bottom: 12px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 14px;
            color: #444444;
        }
        .shipping-note {
            font-size: 11px;
            color: #777777;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 17px;
            font-weight: bold;
            color: #111111;
            border-top: 1px solid #eae6e1;
            padding-top: 15px;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .checkout-form-group {
            margin-bottom: 15px;
        }
        .checkout-form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .checkout-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            background-color: #ffffff;
        }
        .payment-options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }
        .payment-option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            background-color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-transform: none;
        }
        .payment-option-label:hover {
            border-color: #222222;
        }
        .bank-details-box {
            display: none;
            background-color: #ffffff;
            border: 1px solid #eae6e1;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
            color: #333333;
        }
        .checkout-btn {
            width: 100%;
            background-color: #1a1715;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .checkout-btn:hover {
            background-color: #f7cbd7;
            color: #111111;
        }
        .empty-bag-msg {
            padding: 40px 0;
            text-align: center;
            color: #666666;
            font-size: 15px;
        }
        @media (max-width: 850px) {
            .cart-container {
                flex-direction: column;
                margin: 20px auto;
                padding: 0 14px 50px 14px;
                gap: 24px;
            }
            .order-summary-panel {
                width: 100%;
                padding: 20px 16px;
            }
            .cart-header-title {
                font-size: 19px;
            }
            .cart-item-row {
                gap: 12px;
                align-items: flex-start;
            }
            .cart-item-img {
                width: 75px;
                height: 98px;
            }
            .cart-item-title {
                font-size: 13px;
            }
            .cart-item-meta {
                font-size: 12px;
            }
            .cart-item-subtotal {
                font-size: 13px;
            }
        }
    </style>
</head>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE = "/api";
            const cartContainer = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');
            const shippingEl = document.getElementById('cart-shipping');
            const shippingNoteEl = document.getElementById('shipping-info-note');
            const totalEl = document.getElementById('cart-total');
            const summaryPanel = document.getElementById('summary-panel');
            const shippingZoneSelect = document.getElementById('shipping-zone');
            const paymentRadios = document.querySelectorAll('input[name="payment-method"]');
            const bankDetailsBox = document.getElementById('bank-details-box');
            const discountRow = document.getElementById('discount-row');
            const discountEl = document.getElementById('cart-discount');
            const senderNameInput = document.getElementById('sender-name');
            const transactionIdInput = document.getElementById('transaction-id');

            function parsePrice(priceStr) {
                const cleanString = String(priceStr).replace(/^Rs\.?\s*/i, '').replace(/,/g, '').trim();
                return parseFloat(cleanString) || 0;
            }

            function formatPrice(num) {
                return "Rs. " + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function renderCart() {
                const cart = JSON.parse(localStorage.getItem('mimi_cart')) || [];
                cartContainer.innerHTML = "";

                if (cart.length === 0) {
                    cartContainer.innerHTML = `
                        <div class="empty-bag-msg">
                            <p style="margin-bottom: 20px;">Your shopping bag is currently empty.</p>
                            <a href="MIMI BY MARYAM.html" class="cta-button">Browse Dresses</a>
                        </div>
                    `;
                    summaryPanel.style.display = "none";
                    return;
                }

                summaryPanel.style.display = "block";
                let subtotal = 0;

                cart.forEach((item, index) => {
                    const unitPrice = parsePrice(item.price);
                    const itemTotal = unitPrice * item.quantity;
                    subtotal += itemTotal;

                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `
                        <img src="${item.image}" alt="${item.title}" class="cart-item-img">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-meta">Size: ${item.size} &nbsp;|&nbsp; Unit Price: ${item.price}</div>
                            <div class="cart-item-controls">
                                <div class="cart-qty-box">
                                    <button type="button" class="cart-qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                    <span class="cart-qty-num">${item.quantity}</span>
                                    <button type="button" class="cart-qty-btn" onclick="updateQty(${index}, 1)">+</button>
                                </div>
                                <button type="button" class="remove-item-btn" onclick="removeItem(${index})">Remove</button>
                            </div>
                        </div>
                        <div class="cart-item-subtotal">${formatPrice(itemTotal)}</div>
                    `;
                    cartContainer.appendChild(row);
                });

                const selectedZone = shippingZoneSelect.value;
                const flatShippingRate = selectedZone === "local" ? 130 : 225;
                let shipping = 0;

                if (subtotal > 5000) {
                    shipping = 0;
                    shippingEl.textContent = "Free";
                    shippingNoteEl.textContent = "Free shipping applied (Order over Rs. 5,000).";
                } else {
                    shipping = flatShippingRate;
                    shippingEl.textContent = formatPrice(shipping);
                    shippingNoteEl.textContent = selectedZone === "local"
                        ? "Flat local same-city shipping: PKR 115–149 per order (Free over Rs. 5,000)."
                        : "Flat inter-city shipping: PKR 199–249 per order (Free over Rs. 5,000).";
                }

                const selectedPayment = document.querySelector('input[name="payment-method"]:checked').value;
                let discount = 0;

                if (selectedPayment === "Bank Transfer") {
                    discount = subtotal * 0.02;
                    discountRow.style.display = "flex";
                    discountEl.textContent = "- " + formatPrice(discount);
                } else {
                    discountRow.style.display = "none";
                }

                const grandTotal = (subtotal - discount) + shipping;
                subtotalEl.textContent = formatPrice(subtotal);
                totalEl.textContent = formatPrice(grandTotal);
            }

            shippingZoneSelect.addEventListener('change', renderCart);

            paymentRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    const selectedPayment = document.querySelector('input[name="payment-method"]:checked').value;
                    const isBankTransfer = selectedPayment === "Bank Transfer";
                    bankDetailsBox.style.display = isBankTransfer ? "block" : "none";
                    senderNameInput.required = isBankTransfer;
                    transactionIdInput.required = isBankTransfer;
                    renderCart();
                });
            });

            window.updateQty = function(index, change) {
                let cart = JSON.parse(localStorage.getItem('mimi_cart')) || [];
                if (cart[index]) {
                    cart[index].quantity += change;
                    if (cart[index].quantity <= 0) cart.splice(index, 1);
                    localStorage.setItem('mimi_cart', JSON.stringify(cart));
                    renderCart();
                }
            };

            window.removeItem = function(index) {
                let cart = JSON.parse(localStorage.getItem('mimi_cart')) || [];
                cart.splice(index, 1);
                localStorage.setItem('mimi_cart', JSON.stringify(cart));
                renderCart();
            };

            document.getElementById('checkout-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const placeBtn = document.getElementById('place-order-btn');
                placeBtn.disabled = true;
                placeBtn.textContent = "PLACING ORDER...";

                const cart = JSON.parse(localStorage.getItem('mimi_cart')) || [];
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();
                const email = document.getElementById('cust-email').value.trim();
                const address = document.getElementById('cust-address').value.trim();
                const zone = shippingZoneSelect.options[shippingZoneSelect.selectedIndex].text;
                const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;
                const finalTotal = totalEl.textContent;
                const senderName = paymentMethod === "Bank Transfer" ? senderNameInput.value.trim() : "N/A";
                const tid = paymentMethod === "Bank Transfer" ? transactionIdInput.value.trim() : "N/A";

                const newOrder = {
                    orderId: "MM-" + Math.floor(100000 + Math.random() * 900000),
                    date: new Date().toLocaleString('en-PK'),
                    customerName: name,
                    phone: phone,
                    email: email,
                    address: address,
                    deliveryZone: zone,
                    paymentMethod: paymentMethod,
                    senderName: senderName,
                    transactionId: tid,
                    items: cart,
                    totalAmount: finalTotal,
                    status: "Pending"
                };

                try {
                    const response = await fetch(`${API_BASE}/orders`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newOrder)
                    });
                    if (!response.ok) throw new Error("Server error");
                } catch (err) {
                    let existingOrders = JSON.parse(localStorage.getItem('mimi_orders')) || [];
                    existingOrders.unshift(newOrder);
                    localStorage.setItem('mimi_orders', JSON.stringify(existingOrders));
                }

                // Save order for the Thank You page, clear bag, and redirect
                localStorage.setItem('mimi_last_order', JSON.stringify(newOrder));
                localStorage.removeItem('mimi_cart');
                window.location.href = "order-confirmation.html";
            });

            renderCart();
        });
    </script>
</body>
</html>
