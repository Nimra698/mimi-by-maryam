<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Admin Portal | MIMI BY MARYAM</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        body {
            background-color: #faf8f5;
            color: #111111;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #eae6e1;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .login-card p {
            font-size: 13px;
            color: #666666;
            margin-bottom: 25px;
        }
        .admin-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .admin-btn {
            width: 100%;
            background-color: #1a1715;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-btn:hover {
            background-color: #f7cbd7;
            color: #111111;
        }
        .dashboard-wrapper {
            display: none;
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px 80px 20px;
        }
        .admin-topbar {
            background: #ffffff;
            border: 1px solid #eae6e1;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-topbar h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .topbar-actions {
            display: flex;
            gap: 12px;
        }
        .btn-outline {
            background: #ffffff;
            border: 1px solid #222222;
            color: #222222;
            padding: 10px 18px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-outline:hover {
            background: #222222;
            color: #ffffff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid #eae6e1;
            padding: 22px;
        }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777777;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
        }
        .orders-panel {
            background: #ffffff;
            border: 1px solid #eae6e1;
            padding: 25px;
            overflow-x: auto;
        }
        .orders-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .orders-toolbar h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid #dcdcdc;
            font-size: 13px;
            background: #ffffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666666;
            padding: 12px;
            border-bottom: 2px solid #eae6e1;
            background-color: #faf8f5;
        }
        td {
            padding: 15px 12px;
            border-bottom: 1px solid #eae6e1;
            font-size: 13px;
            vertical-align: top;
            line-height: 1.5;
        }
        .badge-status {
            display: inline-block;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 3px;
        }
        .status-Pending { background: #fff3cd; color: #856404; }
        .status-Confirmed { background: #d1ecf1; color: #0c5460; }
        .status-Dispatched { background: #e2e3e5; color: #383d41; }
        .status-Delivered { background: #d4edda; color: #155724; }
        .status-dropdown {
            padding: 6px 8px;
            border: 1px solid #cccccc;
            font-size: 12px;
            margin-top: 6px;
            display: block;
            width: 100%;
        }
        .email-link {
            display: inline-block;
            margin-top: 5px;
            color: #1a1715;
            font-weight: bold;
            font-size: 12px;
            text-decoration: underline;
        }
        .email-link:hover {
            color: #b85d79;
        }
        .delete-order-btn {
            background: none;
            border: none;
            color: #cc0000;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 8px;
            display: block;
        }
        .empty-orders {
            text-align: center;
            padding: 50px 20px;
            color: #777777;
            font-size: 14px;
        }
        .prod-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 14px;
            border: 1px solid #eae6e1;
            margin-bottom: 12px;
            background: #faf8f5;
            flex-wrap: wrap;
        }
        .sold-out-tag {
            display: inline-block;
            background-color: #cc0000;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 8px;
        }
        .toggle-stock-btn {
            padding: 7px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #1a1715;
            background: #ffffff;
            color: #1a1715;
            cursor: pointer;
        }
        .toggle-stock-btn:hover {
            background: #1a1715;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-wrapper" id="login-screen">
        <div class="login-card">
            <h1>Mimi by Maryam</h1>
            <p>Boutique Admin Portal — Enter password to manage orders</p>
            <form id="admin-login-form" autocomplete="off">
                <input type="password" id="admin-password" class="admin-input" placeholder="Enter Admin Password" autocomplete="new-password" required>
                <button type="submit" class="admin-btn">Unlock Dashboard</button>
            </form>
        </div>
    </div>

    <div class="dashboard-wrapper" id="dashboard-screen">
        <header class="admin-topbar">
            <div>
                <h1>Mimi by Maryam — Order Management</h1>
            </div>
            <div class="topbar-actions">
                <a href="MIMI BY MARYAM.html" class="btn-outline">View Storefront</a>
                <button type="button" class="btn-outline" id="logout-btn">Logout</button>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="stat-total-orders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending Verification</div>
                <div class="stat-value" id="stat-pending-orders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Prepaid (Bank Transfer)</div>
                <div class="stat-value" id="stat-prepaid-orders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="stat-total-revenue">Rs. 0.00</div>
            </div>
        </section>

        <section class="orders-panel">
            <div class="orders-toolbar">
                <h2>Customer Orders</h2>
                <select id="status-filter" class="filter-select">
                    <option value="All">All Orders</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Dispatched">Dispatched</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>
            <div id="orders-table-container"></div>
        </section>

        <section class="orders-panel" style="margin-top: 30px;">
            <div class="orders-toolbar">
                <h2>Add New Suit to Boutique</h2>
            </div>

            <form id="add-product-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px;">
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Suit Title *</label>
                    <input type="text" id="new-prod-title" class="admin-input" placeholder="e.g. Royal Silk Edit – Peach Suit" required>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Price for Ages 2–4Y (PKR) *</label>
                    <input type="number" id="new-prod-price-small" class="admin-input" placeholder="e.g. 3500" required>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Price for Ages 5–10Y (PKR) *</label>
                    <input type="number" id="new-prod-price-large" class="admin-input" placeholder="e.g. 4000" required>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Available Sizes *</label>
                    <input type="text" id="new-prod-sizes" class="admin-input" value="1-2Y, 3-4Y, 5-6Y, 7-8Y, 9-10Y" required>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Category Tags (For Search) *</label>
                    <input type="text" id="new-prod-category" class="admin-input" placeholder="e.g. fancy party wear silk" required>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Badge Label (Optional)</label>
                    <input type="text" id="new-prod-badge" class="admin-input" placeholder="e.g. NEW or SOLD OUT">
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Upload Suit Photo *</label>
                    <input type="file" id="new-prod-image" class="admin-input" accept="image/*" required style="padding: 9px;">
                </div>
                <div style="grid-column: 1 / -1;">
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Fabric & Care Details (One detail per line) *</label>
                    <textarea id="new-prod-details" class="admin-input" rows="3" placeholder="Fabric: Pure Raw Silk
Set Includes: Shirt, Dupatta, Trouser
Care: Dry clean recommended" required></textarea>
                </div>
                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="admin-btn" style="max-width: 260px;">+ Publish Suit to Store</button>
                </div>
            </form>

            <h3 style="font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-top: 1px solid #eae6e1; padding-top: 20px;">Admin-Added Suits</h3>
            <div id="custom-products-list"></div>
        </section>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ADMIN_PASS = "maryam123";
            const API_BASE = "/api";

            const loginScreen = document.getElementById('login-screen');
            const dashboardScreen = document.getElementById('dashboard-screen');
            const loginForm = document.getElementById('admin-login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const statusFilter = document.getElementById('status-filter');
            const tableContainer = document.getElementById('orders-table-container');
            const addProductForm = document.getElementById('add-product-form');
            const customProductsList = document.getElementById('custom-products-list');

            if (sessionStorage.getItem('mimi_admin_logged_in') === 'true') {
                showDashboard();
            }

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const enteredPass = document.getElementById('admin-password').value;
                if (enteredPass === ADMIN_PASS) {
                    sessionStorage.setItem('mimi_admin_logged_in', 'true');
                    showDashboard();
                } else {
                    alert("Incorrect password. Please try again.");
                }
            });

            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('mimi_admin_logged_in');
                location.reload();
            });

            function showDashboard() {
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'block';
                renderOrders();
                renderCustomProducts();
            }

            function parseAmount(str) {
                const clean = String(str).replace(/^Rs\.?\s*/i, '').replace(/,/g, '').trim();
                return parseFloat(clean) || 0;
            }

            async function renderOrders() {
                let orders = [];
                try {
                    const response = await fetch(`${API_BASE}/orders`);
                    if (response.ok) orders = await response.json();
                } catch (err) {
                    orders = JSON.parse(localStorage.getItem('mimi_orders')) || [];
                }

                const filterValue = statusFilter.value;
                document.getElementById('stat-total-orders').textContent = orders.length;
                document.getElementById('stat-pending-orders').textContent = orders.filter(o => o.status === "Pending").length;
                document.getElementById('stat-prepaid-orders').textContent = orders.filter(o => o.paymentMethod === "Bank Transfer").length;

                const totalRevenue = orders.reduce((sum, o) => sum + parseAmount(o.totalAmount), 0);
                document.getElementById('stat-total-revenue').textContent = "Rs. " + totalRevenue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const filteredOrders = filterValue === "All" ? orders : orders.filter(o => o.status === filterValue);

                if (filteredOrders.length === 0) {
                    tableContainer.innerHTML = `<div class="empty-orders">No orders found in this category yet.</div>`;
                    return;
                }

                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID & Date</th>
                                <th>Customer & Address</th>
                                <th>Ordered Suits</th>
                                <th>Payment & Proof</th>
                                <th>Total</th>
                                <th>Status & Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                filteredOrders.forEach((order) => {
                    const itemsList = order.items.map(item =>
                        `<div>• <strong>${item.title}</strong> (${item.size}) × ${item.quantity}</div>`
                    ).join('');

                    const paymentDetails = order.paymentMethod === "Bank Transfer"
                        ? `<strong>Bank Transfer (2% Off)</strong><br>Sender: ${order.senderName}<br>TID: <code>${order.transactionId}</code>`
                        : `<strong>Cash on Delivery (COD)</strong>`;

                    const emailSubject = encodeURIComponent(`Order Confirmed #${order.orderId} | MIMI BY MARYAM`);
                    const emailBody = encodeURIComponent(`Assalam-o-Alaikum ${order.customerName},\n\nYour order #${order.orderId} (${order.totalAmount}) from MIMI BY MARYAM has been confirmed and is being prepared with care.\n\nThank you for shopping with us!`);
                    const emailActionHtml = order.email
                        ? `<a href="mailto:${order.email}?subject=${emailSubject}&body=${emailBody}" class="email-link">Confirm on Email</a>`
                        : `<span style="color:#888; font-size:12px;">No email provided</span>`;

                    tableHTML += `
                        <tr>
                            <td><strong>#${order.orderId}</strong><br><span style="color:#777; font-size:12px;">${order.date}</span></td>
                            <td>
                                <strong>${order.customerName}</strong><br>
                                ${order.phone}<br>
                                ${order.email ? `<span style="color:#555;">${order.email}</span><br>` : ''}
                                <span style="color:#555;">${order.address}</span><br>
                                ${emailActionHtml}
                            </td>
                            <td>${itemsList}</td>
                            <td>${paymentDetails}</td>
                            <td><strong>${order.totalAmount}</strong></td>
                            <td>
                                <span class="badge-status status-${order.status}">${order.status}</span>
                                <select class="status-dropdown" onchange="changeOrderStatus('${order.orderId}', this.value)">
                                    <option value="Pending" ${order.status === "Pending" ? "selected" : ""}>Pending</option>
                                    <option value="Confirmed" ${order.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
                                    <option value="Dispatched" ${order.status === "Dispatched" ? "selected" : ""}>Dispatched</option>
                                    <option value="Delivered" ${order.status === "Delivered" ? "selected" : ""}>Delivered</option>
                                </select>
                                <button type="button" class="delete-order-btn" onclick="deleteOrder('${order.orderId}')">Delete Order</button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody></table>`;
                tableContainer.innerHTML = tableHTML;
            }

            statusFilter.addEventListener('change', renderOrders);

            window.changeOrderStatus = async function(orderId, newStatus) {
                try {
                    await fetch(`${API_BASE}/orders/${orderId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                } catch (err) {
                    console.error(err);
                }
                renderOrders();
            };

            window.deleteOrder = async function(orderId) {
                if (confirm("Are you sure you want to delete this order?")) {
                    try {
                        await fetch(`${API_BASE}/orders/${orderId}`, { method: 'DELETE' });
                    } catch (err) {
                        console.error(err);
                    }
                    renderOrders();
                }
            };

            async function renderCustomProducts() {
                let products = [];
                try {
                    const response = await fetch(`${API_BASE}/products`);
                    if (response.ok) products = await response.json();
                } catch (err) {
                    products = [];
                }

                if (products.length === 0) {
                    customProductsList.innerHTML = `<p style="color:#777; font-size:13px;">No custom suits added yet. Use the form above to publish new products.</p>`;
                    return;
                }

                customProductsList.innerHTML = products.map(prod => {
                    const isSoldOut = (prod.badge || '').toUpperCase() === 'SOLD OUT' || (prod.badge || '').toUpperCase() === 'OUT OF STOCK';
                    return `
                        <div class="prod-item-card">
                            <div style="display:flex; align-items:center; gap:14px;">
                                <img src="${prod.mainImg}" alt="${prod.title}" style="width:55px; height:70px; object-fit:cover; border:1px solid #eae6e1;">
                                <div>
                                    <strong>${prod.title}</strong>
                                    ${isSoldOut ? `<span class="sold-out-tag">SOLD OUT</span>` : (prod.badge ? `<span style="font-size:11px; background:#f7cbd7; padding:2px 6px; margin-left:6px; font-weight:bold;">${prod.badge}</span>` : '')}
                                    <div style="font-size:12px; color:#555; margin-top:4px;">${prod.price} &nbsp;|&nbsp; Sizes: ${prod.sizes}</div>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <button type="button" class="toggle-stock-btn" onclick="toggleSoldOut('${prod.id}', ${isSoldOut})">
                                    ${isSoldOut ? 'Mark In Stock' : 'Mark Sold Out'}
                                </button>
                                <button type="button" class="delete-order-btn" style="margin-top:0;" onclick="deleteCustomProduct('${prod.id}')">Remove</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            addProductForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('new-prod-title').value.trim();
                const rawSmall = parseFloat(document.getElementById('new-prod-price-small').value);
                const rawLarge = parseFloat(document.getElementById('new-prod-price-large').value);
                const sizes = document.getElementById('new-prod-sizes').value.trim();
                const category = document.getElementById('new-prod-category').value.trim();
                const badge = document.getElementById('new-prod-badge').value.trim();
                const detailsText = document.getElementById('new-prod-details').value.trim();
                const imageFile = document.getElementById('new-prod-image').files[0];

                if (!imageFile) {
                    alert("Please select an image file.");
                    return;
                }

                const formattedPriceSmall = "Rs. " + rawSmall.toLocaleString('en-US');
                const formattedPriceLarge = "Rs. " + rawLarge.toLocaleString('en-US');
                const displayRange = rawSmall === rawLarge ? formattedPriceSmall : `${formattedPriceSmall} – ${formattedPriceLarge}`;
                const detailsArray = detailsText.split('\n').map(line => line.trim()).filter(Boolean);

                const reader = new FileReader();
                reader.onload = async function(event) {
                    const newProduct = {
                        id: "custom-" + Date.now(),
                        title: title,
                        price: displayRange,
                        priceSmall: formattedPriceSmall,
                        priceLarge: formattedPriceLarge,
                        sizes: sizes,
                        category: category,
                        badge: badge,
                        mainImg: event.target.result,
                        details: detailsArray
                    };

                    const response = await fetch(`${API_BASE}/products`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newProduct)
                    });

                    if (response.ok) {
                        alert(`"${title}" has been saved to your MongoDB database and published!`);
                        addProductForm.reset();
                        renderCustomProducts();
                    } else {
                        alert("Failed to save suit to server.");
                    }
                };
                reader.readAsDataURL(imageFile);
            });

            window.toggleSoldOut = async function(prodId, currentlySoldOut) {
                const newBadge = currentlySoldOut ? "" : "SOLD OUT";
                try {
                    await fetch(`${API_BASE}/products/${prodId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ badge: newBadge })
                    });
                } catch (err) {
                    console.error(err);
                }
                renderCustomProducts();
            };

            window.deleteCustomProduct = async function(prodId) {
                if (confirm("Remove this suit from your storefront?")) {
                    await fetch(`${API_BASE}/products/${prodId}`, { method: 'DELETE' });
                    renderCustomProducts();
                }
            };
        });
    </script>
</body>
</html>
